AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BMTN Friday — internal weekly report incentive portal

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        FRONTEND_URL: !Sub 'https://${CloudFrontDistribution.DomainName}'
    Layers:
      - !Ref DepsLayer

Parameters:
  SlackWebhookUrl:
    Type: String
    Default: ''
    NoEcho: true
    Description: Slack workflow webhook URL — posts NAG IS LIVE to the channel

Resources:

  # ── Cognito — Microsoft Entra ID federation ───────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: bmtnfriday
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: employee_id
          AttributeDataType: String
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true  # employees must be provisioned by admin
      UserPoolTags:
        Project: bmtnfriday


  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: bmtnfriday-auth
      UserPoolId: !Ref UserPool

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Portal administrators

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: bmtnfriday-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - https://bmtnfriday.com/
        - http://localhost:5173/
      LogoutURLs:
        - https://bmtnfriday.com/
        - http://localhost:5173/
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ── DynamoDB ──────────────────────────────────────────────────────────────
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bmtnfriday
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ── Shared layer ──────────────────────────────────────────────────────────
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: bmtnfriday-deps
      ContentUri: layers/nodejs/
      CompatibleRuntimes:
        - nodejs20.x
    Metadata:
      BuildMethod: nodejs20.x

  # ── Cognito authorizer ────────────────────────────────────────────────────
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn

  # ── Lambda functions ──────────────────────────────────────────────────────

  # Cycles
  GetCyclesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/cycles/
      Handler: get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles
            Method: GET

  CreateCycleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/cycles/
      Handler: create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles
            Method: POST

  GetWinnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/cycles/
      Handler: winner.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}/winner
            Method: GET

  GetCycleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/cycles/
      Handler: getOne.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}
            Method: GET

  # Employees
  GetEmployeesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/employees/
      Handler: get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /employees
            Method: GET

  UpsertEmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/employees/
      Handler: upsert.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /employees
            Method: POST

  # Submissions
  SubmitReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/submissions/
      Handler: submit.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}/submit
            Method: POST

  GetSubmissionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/submissions/
      Handler: get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}/submissions
            Method: GET

  # Portal (public status — no auth required)
  PortalStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/portal/
      Handler: status.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /portal/status
            Method: GET
            Auth:
              Authorizer: NONE

  # IAM role for EventBridge Scheduler to invoke NagFireFunction
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bmtnfriday-scheduler-invoke-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeNagFire
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NagFireFunction.Arn

  # Nag
  NagStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/nag/
      Handler: status.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}/nag
            Method: GET

  ClaimNagFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/nag/
      Handler: claim.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}/nag/claim
            Method: POST

  # PTO bonus
  ClaimPtoBonusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/pto/
      Handler: claim.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}/pto
            Method: POST

  # Weekly pool calculator (EventBridge — runs Fri 9 PM ET)
  WeeklyPoolFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/weekly/
      Handler: pool.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        FridayClose:
          Type: Schedule
          Properties:
            Schedule: cron(0 2 ? * SAT *)  # 9 PM ET = 2 AM UTC Saturday

  # Fires at 3 PM ET every Friday — picks random offset, schedules NagFireFunction
  NagSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/nag/
      Handler: schedule.handler
      Environment:
        Variables:
          NAG_FIRE_FUNCTION_ARN: !GetAtt NagFireFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: scheduler:CreateSchedule
              Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/bmtnfriday-nag-*'
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerInvokeRole.Arn
      Events:
        FridayNag:
          Type: Schedule
          Properties:
            Schedule: cron(0 20 ? * FRI *)  # 3 PM ET = 8 PM UTC (EDT)

  # Invoked at random time 3:00–3:30 PM ET — opens nag in DB and yells in Slack
  NagFireFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/nag/
      Handler: fire.handler
      Environment:
        Variables:
          SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table

  # ── S3 + CloudFront ───────────────────────────────────────────────────────
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: bmtnfriday-web
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: bmtnfriday-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          AllowedMethods: [GET, HEAD, OPTIONS]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'
  CloudFrontUrl:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  TableName:
    Value: !Ref Table
  WebBucketName:
    Value: !Ref WebBucket
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub 'bmtnfriday-auth.auth.${AWS::Region}.amazoncognito.com'
