AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BMTN Friday — internal weekly report incentive portal

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        FRONTEND_URL: !Sub 'https://${CloudFrontDistribution.DomainName}'
    Layers:
      - !Ref DepsLayer

Parameters:
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  SlackBotToken:
    Type: String
    Default: ''
  SlackChannelId:
    Type: String
    Default: ''

Resources:

  # ── DynamoDB ──────────────────────────────────────────────────────────────
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bmtnfriday
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ── Shared layer ──────────────────────────────────────────────────────────
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: bmtnfriday-deps
      ContentUri: layers/nodejs/
      CompatibleRuntimes:
        - nodejs20.x
    Metadata:
      BuildMethod: nodejs20.x

  # ── Cognito authorizer ────────────────────────────────────────────────────
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  # ── Lambda functions ──────────────────────────────────────────────────────

  # Cycles
  GetCyclesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/cycles/
      Handler: get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles
            Method: GET

  CreateCycleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/cycles/
      Handler: create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles
            Method: POST

  GetCycleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/cycles/
      Handler: getOne.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}
            Method: GET

  # Employees
  GetEmployeesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/employees/
      Handler: get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /employees
            Method: GET

  UpsertEmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/employees/
      Handler: upsert.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /employees
            Method: POST

  # Submissions
  SubmitReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/submissions/
      Handler: submit.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}/submit
            Method: POST

  GetSubmissionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/submissions/
      Handler: get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}/submissions
            Method: GET

  # Portal (public status — no auth required)
  PortalStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/portal/
      Handler: status.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /portal/status
            Method: GET
            Auth:
              Authorizer: NONE

  # Nag
  NagStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/nag/
      Handler: status.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}/nag
            Method: GET

  ClaimNagFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/nag/
      Handler: claim.handler
      Environment:
        Variables:
          SLACK_BOT_TOKEN: !Ref SlackBotToken
          SLACK_CHANNEL_ID: !Ref SlackChannelId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cycles/{id}/nag/claim
            Method: POST

  # Weekly pool calculator (EventBridge — runs Fri 9 PM ET)
  WeeklyPoolFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/weekly/
      Handler: pool.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        FridayClose:
          Type: Schedule
          Properties:
            Schedule: cron(0 2 ? * SAT *)  # 9 PM ET = 2 AM UTC Saturday

  # Nag window opener (EventBridge — Fri 3:00–3:30 PM ET)
  NagWindowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/nag/
      Handler: open.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        FridayNag:
          Type: Schedule
          Properties:
            Schedule: cron(0 20 ? * FRI *)  # 3 PM ET = 8 PM UTC

  # ── S3 + CloudFront ───────────────────────────────────────────────────────
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: bmtnfriday-web
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: bmtnfriday-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          AllowedMethods: [GET, HEAD, OPTIONS]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'
  CloudFrontUrl:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  TableName:
    Value: !Ref Table
  WebBucketName:
    Value: !Ref WebBucket
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
